<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Onboarding</title>
    <style>
        /* Base Styling & Background Gradient */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top right, #6366f1, #4f46e5, #312e81);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Glassmorphism Phone Container */
        .phone {
            width: 360px;
            height: 720px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 35px;
            box-sizing: border-box;
            color: #ffffff;
        }

        /* Top Action Bar (Spaced to hold Back on left, Skip on right) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 32px;
        }

        /* Nav Buttons (Shared styling for Back & Skip) */
        .nav-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #e0e7ff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        
        /* Unique Back Arrow Font Size override */
        .back-btn {
            font-size: 16px;
            padding: 4px 14px 6px 14px; /* Slight alignment tweak for arrow */
            visibility: hidden; /* Hidden on first screen by default */
        }

        /* Content Slides with Smooth Transitions */
        .slide {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .slide.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hero Graphic Illustration Area */
        .graphic-container {
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
        }
        .glow-bg {
            position: absolute;
            width: 140px;
            height: 140px;
            background: #38bdf8;
            filter: blur(40px);
            opacity: 0.4;
            border-radius: 50%;
            z-index: 1;
        }
        .main-emoji {
            font-size: 85px;
            z-index: 2;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }

        /* Floating Badge Elements (The Visual Polish) */
        .floating-badge {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            z-index: 3;
        }
        .badge-1 { top: 20px; left: 40px; animation: bounceFloat 4s ease-in-out infinite; }
        .badge-2 { bottom: 20px; right: 40px; animation: bounceFloat 4s ease-in-out infinite 1.5s; }
        
        @keyframes bounceFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Typography */
        h2 {
            margin: 0 0 12px 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to bottom, #ffffff, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #c7d2fe;
            font-size: 15px;
            line-height: 1.6;
            margin: 0 10px;
        }

        /* Bottom Controls */
        .bottom-bar {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }
        .dots {
            display: flex;
            gap: 8px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dot.active {
            background: #38bdf8; /* Vibrant cyan accent */
            width: 24px;
            border-radius: 6px;
        }
        
        /* Premium Glowing Button */
        .next-btn {
            width: 100%;
            padding: 16px;
            background: #ffffff;
            color: #4f46e5;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }
        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(56, 189, 248, 0.4);
        }
        .next-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="phone">
        <div class="top-bar">
            <button class="nav-btn back-btn" id="backBtn" onclick="prevStep()">←</button>
            <button class="nav-btn skip-btn" id="skipBtn" onclick="goToStep(2)">Skip</button>
        </div>

        <div class="slides-container">
            
            <div class="slide active">
                <div class="graphic-container">
                    <div class="glow-bg"></div>
                    <div class="main-emoji">💳</div>
                    <div class="floating-badge badge-1">💵</div>
                    <div class="floating-badge badge-2">📉</div>
                </div>
                <h2>Track Effortlessly</h2>
                <p>Sync your cards or scan receipts to capture every coffee, bill, and treat instantly.</p>
            </div>

            <div class="slide">
                <div class="graphic-container">
                    <div class="glow-bg" style="background: #fb7185;"></div>
                    <div class="main-emoji">🎯</div>
                    <div class="floating-badge badge-1">🛍️</div>
                    <div class="floating-badge badge-2">🚫</div>
                </div>
                <h2>Smart Guardrails</h2>
                <p>Set custom category targets and goals to save money.</p>
            </div>

            <div class="slide">
                <div class="graphic-container">
                    <div class="glow-bg" style="background: #4ade80;"></div>
                    <div class="main-emoji">💰</div>
                    <div class="floating-badge badge-1">📈</div>
                    <div class="floating-badge badge-2">🏡</div>
                </div>
                <h2>Automate Wealth</h2>
                <p>Uncover micro-saving opportunities to save your wallet.</p>
            </div>
            
        </div>

        <div class="bottom-bar">
            <div class="dots">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <button class="next-btn" id="nextBtn" onclick="nextStep()">Next</button>
        </div>
    </div>

    <script>
        let currentStep = 0;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        const nextBtn = document.getElementById('nextBtn');
        const skipBtn = document.getElementById('skipBtn');
        const backBtn = document.getElementById('backBtn');

        function goToStep(step) {
            slides[currentStep].classList.remove('active');
            dots[currentStep].classList.remove('active');

            currentStep = step;

            slides[currentStep].classList.add('active');
            dots[currentStep].classList.add('active');

            // --- NAVIGATION CONTROL CONTROLS ---

            // Handle Back Button Visibility
            if (currentStep === 0) {
                backBtn.style.visibility = "hidden"; // No back path on slide 1
            } else {
                backBtn.style.visibility = "visible"; // Show back arrow on slides 2 and 3
            }

            // Handle Skip & Main Button Configurations on Final Screen
            if (currentStep === slides.length - 1) {
                nextBtn.innerText = "Start Your Journey";
                nextBtn.style.background = "#38bdf8"; 
                nextBtn.style.color = "#ffffff";
                skipBtn.style.visibility = "hidden";
            } else {
                nextBtn.innerText = "Next";
                nextBtn.style.background = "#ffffff";
                nextBtn.style.color = "#4f46e5";
                skipBtn.style.visibility = "visible";
            }
        }

        function nextStep() {
            if (currentStep < slides.length - 1) {
                goToStep(currentStep + 1);
            } else {
                alert("Welcome aboard! Let's get started!");
            }
        }

        // Added functionality to go backwards
        function prevStep() {
            if (currentStep > 0) {
                goToStep(currentStep - 1);
            }
        }
    </script>
</body>
</html>
